name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build ${{ matrix.platform_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            platform_name: darwin-arm64
          - goos: darwin
            goarch: amd64
            platform_name: darwin-amd64
          - goos: linux
            goarch: amd64
            platform_name: linux-amd64
          - goos: linux
            goarch: arm64
            platform_name: linux-arm64
          - goos: windows
            goarch: amd64
            platform_name: windows-amd64
            ext: .exe
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARTIFACT="gh-queued-job_${VERSION}_${{ matrix.platform_name }}${{ matrix.ext }}"
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "${ARTIFACT}" .
          sha256sum "${ARTIFACT}" > "${ARTIFACT}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform_name }}
          path: |
            gh-queued-job_*
          retention-days: 1

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: release-*
          merge-multiple: true

      - name: Generate combined checksums
        run: |
          cd dist
          cat *.sha256 > checksums.txt

      - name: Upload release assets
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*
